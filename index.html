  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">
      <svg width="26" height="27" viewBox="0 0 40 42" fill="none"><path d="M9 5C4 7 5 15 8 21C11 28 12 37 17 37C21 37 20 27 23 27C27 27 26 37 31 37C36 36 34 26 37 17C39 9 35 4 30 5C25 6 24 8 20 8C16 8 14 3 9 5Z" fill="#6BE5D0"/><path d="M14 13C17 11 23 11 26 13" stroke="#0A343A" stroke-width="3" stroke-linecap="round"/></svg>
    </div><div>SUGAR SIGNALS<span class="brand-sub">DIGITAL CARIOLOGY ESCAPE ROOM</span></div></div>
    <div class="top-meta"><span class="status-pill"><i class="status-dot"></i>Learning simulation</span><span class="status-pill hide-mobile">Nutritional education × cariology</span></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <p class="footer-note">Educational simulation for learning. Individual caries risk is multifactorial; this activity is not a substitute for individualized dental advice.</p>
</div>
<script>
(() => {
 const app=document.getElementById('app');
 // Declare helpers before building the randomized question banks.
 const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
 const stageNames=['Hidden Sugar Scanner','Stephan Curve Lab','Fermentability Lab','Saliva & Clearance','Diet Modification Clinic','Cariology Science Quiz'];
 const stageDesc=[
 'Uncover sugar names hidden in ingredient lists and understand what labels can—and cannot—tell you.',
 'Interpret plaque pH changes after fermentable carbohydrate exposure and understand the Stephan curve.',
 'Explore which carbohydrates plaque bacteria can ferment and why acidogenicity matters.',
 'Investigate how saliva supports clearance, buffering and recovery after sugar exposure.',
 'Choose practical, patient-friendly dietary changes that reduce repeated caries challenges.',
 'A five-question scientific challenge combining cariology, diet, saliva, enamel and prevention.'
 ];
 // Five evidence-based concepts per room; four alternate stems per concept = 20-question bank per stage.
 const concepts=[
 [
  ['Which ingredient is another name for table sugar?','Sucrose',['Sodium chloride','Sucralose','Citric acid'],'Sucrose is the common chemical name for table sugar.'],
  ['Which label term clearly indicates a sugar syrup?','Glucose syrup',['Gelatin','Sodium bicarbonate','Stevia leaf extract'],'Glucose syrup supplies fermentable sugars and is used in many processed foods.'],
  ['What does “dextrose” usually refer to on a food label?','Glucose',['Xylitol','Salt','Starch-free fibre'],'Dextrose is another name for glucose, a fermentable sugar.'],
  ['Which statement about a “healthy” front-of-pack claim is most accurate?','Check the ingredient list and nutrition panel too',['The claim guarantees no added sugars','It means the food cannot contribute to caries','It replaces the need to read ingredients'],'Marketing claims do not replace checking ingredients and nutrition information.'],
  ['Which sweetener is a non-sugar high-intensity sweetener?','Sucralose',['Fructose','Sucrose','Glucose syrup'],'Sucralose is not a fermentable dietary sugar, although the whole product may contain other ingredients.']
 ],
 [
  ['What typically happens to plaque pH soon after fermentable sugar is consumed?','It falls as bacteria produce acids',['It rises permanently','It stays exactly constant','It becomes neutral instantly'],'Bacterial metabolism of fermentable carbohydrate can rapidly lower plaque pH.'],
  ['The Stephan curve mainly illustrates which relationship?','Plaque pH over time after a carbohydrate exposure',['Tooth eruption by age','Salivary volume by body weight','Enamel thickness during brushing'],'The curve shows a rapid pH fall followed by gradual recovery.'],
  ['The often-quoted critical pH for enamel is approximately:','5.5, with variation by oral conditions',['2.0 in every person','7.8 for all tooth surfaces','Exactly 6.9 in every situation'],'About 5.5 is a useful approximation, not a universal fixed threshold.'],
  ['Why can frequent sipping of a sugary drink be concerning?','It can trigger repeated pH drops before recovery is complete',['Saliva stops working forever after one sip','Sugar only matters if the drink is hot','Frequency has no relationship to caries'],'Repeated exposures can increase the time plaque spends under acidic conditions.'],
  ['During the recovery phase of a Stephan curve, what helps pH move back toward resting levels?','Salivary clearance and buffering',['More frequent sugar exposure','Plaque bacteria producing more acid','Avoiding all water'],'Saliva helps clear substrates and buffer acids, supporting pH recovery.']
 ],
 [
  ['Which carbohydrate is generally fermentable by plaque bacteria?','Sucrose',['Sucralose','Xylitol','Acesulfame potassium'],'Sucrose can be metabolized by plaque bacteria to produce acids.'],
  ['Which sweetener is not fermented like dietary sugars by cariogenic plaque bacteria?','Xylitol',['Glucose','Fructose','Sucrose'],'Xylitol is a sugar alcohol and is not fermented like common dietary sugars.'],
  ['Why can lactose in milk still be relevant to plaque acid production?','It is a fermentable carbohydrate',['It is a strong acid itself','It is identical to fluoride','It cannot be metabolized by oral bacteria'],'Lactose can be fermented, though food matrix and exposure pattern affect risk.'],
  ['What does “acidogenicity” describe in this context?','The ability to generate acid, often through microbial metabolism',['The ability to whiten enamel','How sweet a food tastes to every person','The amount of calcium in a food'],'Acidogenicity refers to acid production; sweetness alone does not reliably predict it.'],
  ['Dental caries differs from dental erosion because caries is primarily:','A biofilm-mediated disease driven by acid from microbial metabolism',['Direct chemical dissolution by dietary acid alone','A stain caused only by dark drinks','A condition caused only by tooth brushing'],'Caries involves biofilm and fermentable carbohydrate; erosion is direct chemical tooth wear from acids.']
 ],
 [
  ['Which is a key role of saliva after sugar exposure?','Diluting and clearing sugars while buffering acids',['Adding fermentable sugar to plaque','Stopping all bacterial activity permanently','Making enamel dissolve faster in every case'],'Saliva contributes to clearance, buffering and remineralization support.'],
  ['What can reduced salivary flow do?','Slow clearance and prolong acidic conditions',['Guarantee no plaque forms','Make all foods non-cariogenic','Remove the need for fluoride'],'Low flow may impair clearance and buffering and is associated with higher oral risk.'],
  ['Which activity commonly stimulates salivary flow?','Chewing, including sugar-free gum for many people',['Prolonged dry-mouth breathing only','Avoiding all fluids','Sipping a sugary drink continuously'],'Chewing stimulates saliva; sugar-free gum may help some people, when appropriate.'],
  ['How does water between meals help in a practical prevention plan?','It avoids adding sugar and can help rinse and dilute oral residues',['It replaces fluoride toothpaste completely','It guarantees caries cannot occur','It makes sugary drinks harmless'],'Water is a sensible between-meal choice but does not replace other preventive care.'],
  ['Persistent dry mouth should prompt a person to:','Discuss it with a dental or healthcare professional',['Stop brushing','Use sugary sweets all day','Assume it is always harmless'],'Persistent dry mouth can have causes and oral consequences worth assessing professionally.']
 ],
 [
  ['Which change best reduces repeated sugar challenges to teeth?','Reduce how often sugary foods and drinks are consumed',['Sip sweetened drinks all day','Add more sugary snacks between meals','Replace water with juice'],'Frequency of fermentable carbohydrate exposure is an important modifiable factor.'],
  ['What is a sensible drink choice between meals?','Water or an unsweetened drink',['Sugary soda sipped slowly','Sweetened energy drink','Fruit juice continuously'],'Water or unsweetened drinks reduce unnecessary sugar exposure.'],
  ['What is a useful approach when a person chooses sugary food?','Have it with a meal rather than grazing repeatedly for hours',['Keep nibbling it throughout the day','Brush only once a week','Assume sticky foods are always sugar-free'],'Concentrating exposure with meals can reduce the number of separate acid challenges.'],
  ['Which daily practice supports caries prevention alongside diet changes?','Brush twice daily with fluoride toothpaste',['Avoid fluoride in all circumstances','Brush only when teeth hurt','Use mouthwash instead of brushing every time'],'Twice-daily fluoride toothpaste is a key preventive measure.'],
  ['What is the best way to identify added sugars in packaged food?','Review the ingredient list and nutrition information',['Rely only on package colour','Assume “natural” means sugar-free','Check only the calorie number'],'Labels can reveal sugar names and the amount per serving; interpret them in context.']
 ]
 ];
 const variants=[
  ['Which option is correct?','Choose the best answer:','In a cariology case, which statement is accurate?','Select the scientifically best response:'],
  ['Which process is most likely?','What should a dental educator explain?','Which interpretation is best supported?','Which answer best fits the evidence?'],
  ['A patient asks about this. What is the best answer?','Which statement should be selected?','What is the most accurate conclusion?','Choose the correct scientific explanation:'],
  ['Which option best describes this concept?','What is the most appropriate response?','Which statement is true?','Pick the best answer for this case:'],
  ['Which answer is most appropriate?','What should be recommended or explained?','Which statement is scientifically accurate?','Choose the best response:']
 ];
 const banks=concepts.map((group,si)=>group.flatMap((c,ci)=>variants[ci%5].map((v,vi)=>({q:vi===0?c[0]:v+' '+c[0].charAt(0).toLowerCase()+c[0].slice(1),correct:c[1],wrong:c[2],exp:c[3],topic:si}))));
 // General science quiz: 20 distinct questions sampled from the topic banks, independent of the room-specific banks.
 const allQuestions=banks.flatMap(b=>shuffle(b).slice(0,4));
 const state={screen:'welcome',stage:0,completed:Array(6).fill(false),digits:[],code:'',lockInput:'',learnerName:'',questions:[],qIndex:0,answers:[],feedback:null,score:0};
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function makeQuestions(stage){let pool=stage===5?shuffle(allQuestions):shuffle(banks[stage]);return pool.slice(0,5).map(item=>{const opts=shuffle([item.correct,...item.wrong]);return {...item,options:opts,correctIndex:opts.indexOf(item.correct)};});}
 function newCode(){state.digits=Array.from({length:6},()=>String(Math.floor(Math.random()*10)));state.code=state.digits.join('');}
 function shell(content,cls=''){return `<section class="screen ${cls}">${content}</section>`;}
 function btn(label,action,kind='btn-primary'){return `<button type="button" class="btn ${kind}" data-action="${action}">${label}</button>`;}
 function header(){let done=state.completed.filter(Boolean).length;return `<div class="game-head"><div><small>Mission progress</small><div class="progress-line"><div class="progress-fill" style="width:${done/6*100}%"></div></div></div><strong>${done}/6 STAGES</strong></div><nav class="room-tabs">${stageNames.map((n,i)=>`<button class="room-tab ${i===state.stage?'active':''} ${state.completed[i]?'done':''}" data-stage="${i}" ${i>0&&!state.completed.slice(0,i).every(Boolean)?'disabled':''}><span class="tab-number">0${i+1}</span>${esc(n)}</button>`).join('')}</nav>`;}
 function welcome(){return shell(`<section class="hero"><div class="hero-copy"><div class="eyebrow">Nutritional education · Cariology</div><h1>THE HIDDEN<br><span>SUGAR CASE.</span></h1><p>A mobile-friendly digital escape room about hidden sugars, diet modification, plaque pH and dental caries. Each play generates fresh questions and a new security code.</p><div class="hero-actions">${btn('Start the mission →','start')}${btn('Learning goals','goals','btn-secondary')}</div><div class="hero-note">6 stages · 5 questions per stage · randomized question banks</div><div class="stat-row"><div class="stat"><strong>120+</strong><span>Question variations</span></div><div class="stat"><strong>30</strong><span>Questions per run</span></div><div class="stat"><strong>NEW</strong><span>Code each run</span></div></div></div><div class="hero-art"><div class="art-orbit"></div><div class="float-tag tag-one">Hidden sugars<small>Read the label</small></div><div class="tooth-card"><svg class="tooth-icon" viewBox="0 0 140 160" fill="none"><path d="M31 13C17 19 17 39 25 60C32 79 33 125 47 136C58 145 61 116 68 105C73 97 78 97 84 105C93 119 96 146 108 136C122 124 120 86 128 59C135 35 128 15 112 13C97 11 88 23 73 23C57 23 46 7 31 13Z" fill="#DDFBF2" stroke="#7BE4D0" stroke-width="3"/></svg><div class="tooth-label">Decode the caries risk</div></div><div class="float-tag tag-two">Stephan Curve<small>Explore pH recovery</small></div></div></section><div id="learning-goals" class="panel" style="display:none;margin-top:14px;padding:20px"><h3>Learning goals</h3><p>Stephan curve · acidogenicity · fermentable vs non-fermentable sugars · salivary clearance · hidden sugars · diet modification · caries prevention.</p></div>`);}
 function briefing(){return shell(`<div class="panel"><div class="brief-head"><div><div class="eyebrow">Mission briefing</div><h2>Your patient needs a plan.</h2></div><span class="step-tag">CASE FILE #SS-${Math.floor(100+Math.random()*900)}</span></div><div class="brief-body"><div><h3>Mission objectives</h3><p>Complete six stages. Each stage serves five randomly selected questions from a bank of twenty. The final stage is a scientific quiz covering all core concepts.</p><ul class="checklist"><li><span class="checkmark">✓</span><span>Read food labels and identify hidden sugars.</span></li><li><span class="checkmark">✓</span><span>Interpret the Stephan curve and pH recovery.</span></li><li><span class="checkmark">✓</span><span>Understand fermentability and acidogenicity.</span></li><li><span class="checkmark">✓</span><span>Explain saliva's protective functions.</span></li><li><span class="checkmark">✓</span><span>Choose evidence-informed diet modifications.</span></li><li><span class="checkmark">✓</span><span>Pass a five-question scientific quiz.</span></li></ul></div><div class="case-file"><div class="case-title"><span class="case-icon">✚</span>Patient case · Sarah</div><p>Sarah snacks frequently and often sips sweetened drinks. Your task is to assess the dietary pattern—not blame individual foods—and apply the science of caries prevention.</p><div class="case-info"><div><small>Focus</small><strong>Hidden sugars</strong></div><div><small>Goal</small><strong>Lower repeated acid challenges</strong></div></div><div class="callout">Educational simulation only. Caries risk is multifactorial and also depends on biofilm, fluoride, saliva, tooth factors and individual circumstances.</div><div class="form-actions">${btn('Enter Stage 1 →','enter')}</div></div></div></div>`);}
 function stageScreen(){const s=state.stage,qs=state.questions,cur=qs[state.qIndex],answered=state.answers[state.qIndex],done=state.completed[s];return shell(`${header()}<div class="room-layout"><article class="panel room-main"><div class="room-topline"><span class="room-label">Stage 0${s+1} · ${s===5?'FINAL SCIENCE QUIZ':'Challenge'}</span><span class="room-state">Question ${state.qIndex+1} / 5</span></div><div class="eyebrow">${esc(stageNames[s])}</div><h2>${esc(stageNames[s])}</h2><p class="challenge-desc">${esc(stageDesc[s])}</p><div class="progress-line" style="margin:14px 0 20px"><div class="progress-fill" style="width:${(state.qIndex+1)/5*100}%"></div></div><div class="question">${esc(cur.q)}</div><div class="option-list">${cur.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answered!==undefined&&answered===i?'checked':''} ${answered!==undefined?'disabled':''}><span class="ingredient-name"><strong>${esc(o)}</strong></span></label>`).join('')}</div>${state.feedback?`<div class="feedback ${state.feedback.good?'good':'bad'}"><strong>${state.feedback.good?'Correct':'Not quite'}</strong>${esc(state.feedback.text)}</div>`:''}<div class="form-actions">${answered===undefined?btn('Submit answer →','answer'):state.qIndex<4?btn('Next question →','next-q'):done?btn(s===5?'Go to final lock →':'Next stage →',s===5?'final-lock':'next-stage'):btn('Finish stage →','finish-stage')}${btn('Restart this stage','reset-stage','btn-ghost btn-small')}</div>${done?`<div class="feedback good"><strong>Stage cleared · Code digit earned</strong><div class="digit-reward"><span>YOUR RANDOM DIGIT</span><span class="digit-number">${state.digits[s]}</span></div></div>`:''}</article><aside class="room-aside"><div class="aside-card"><h3>Core concept</h3><p>${s===0?'Sugar names can include sucrose, glucose, fructose, dextrose and syrups.':s===1?'Plaque pH can fall after fermentable carbohydrate exposure and recover gradually.':s===2?'Fermentable carbohydrates can be metabolized by plaque bacteria to produce acids.':s===3?'Saliva supports clearance, buffering and remineralization.':s===4?'Reducing frequency of sugar exposure and using fluoride are practical prevention measures.':'Connect the science: caries is multifactorial, and dietary pattern is one modifiable factor.'}</p></div><div class="aside-card dark"><h3>Mission status</h3><p>${state.completed.filter(Boolean).length} of 6 stages cleared.</p><ul><li>5 questions in each stage</li><li>Question order and wording vary</li><li>Final code changes every new mission</li></ul></div></aside></div>`);}
 function lockScreen(){return shell(`${header()}<div class="panel lock-layout"><div><div class="eyebrow">Final security lock</div><h2>Unlock the patient record.</h2><p>Enter the six digits earned from the stages, in order. A fresh code is generated each time you start a new mission.</p><div class="code-slots">${Array.from({length:6},(_,i)=>`<div class="code-slot ${state.lockInput[i]?'filled':''}">${state.lockInput[i]||'·'}</div>`).join('')}</div>${state.feedback?`<div class="feedback bad">${esc(state.feedback.text)}</div>`:''}<div class="keypad">${['1','2','3','4','5','6','7','8','9','clear','0','back'].map(k=>`<button class="key" data-key="${k}">${k==='clear'?'CLR':k==='back'?'⌫':k}</button>`).join('')}</div><div class="form-actions">${btn('Unlock record →','unlock')}${btn('Back to stages','back-room','btn-ghost')}</div></div><div class="lock-graphic"><div class="lock-icon">⌑</div><strong>FINAL SECURITY LOCK</strong><small>6-digit access code</small></div></div>`,'lock-screen');}
 function certificate(){return shell(`<div class="panel unlock-screen"><div class="unlock-icon">✓</div><div class="eyebrow" style="justify-content:center">Access granted</div><h2>Mission complete!</h2><p>You completed all six stages and applied the core concepts of hidden sugars, plaque acid production, salivary clearance and diet modification.</p><div class="stars">★★★★★</div><div class="badge">Mission complete · 6/6 stages</div><div class="form-actions no-print" style="justify-content:center;margin-top:20px"><label style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center">Certificate name <input id="learnerName" value="${esc(state.learnerName)}" placeholder="Enter your name" style="padding:11px;border:1px solid #cfdfda;border-radius:10px;max-width:260px"></label>${btn('Print / Save as PDF','print-certificate')}${btn('Restart mission ↻','restart','btn-secondary')}</div><div class="cert-preview"><div class="certificate"><div class="cert-kicker">Sugar Signals · Digital Cariology Escape Room</div><h2>Certificate of Completion</h2><p>This certificate is presented to</p><div class="cert-name" id="certName">${esc(state.learnerName.trim()||'Cariology Explorer')}</div><p>for completing the interactive mission on</p><p style="font-weight:900;color:#0b7677">HIDDEN SUGARS, DIET MODIFICATION & DENTAL CARIES</p><p>Core topics: Stephan curve · Fermentable carbohydrates · Acidogenicity · Salivary clearance</p><div class="cert-seal">✓</div><p style="font-size:.7rem;color:#9c8956">EDUCATIONAL COMPLETION · NOT A PROFESSIONAL LICENCE</p></div></div></div>`,'certificate-screen');}
 function render(){app.innerHTML=state.screen==='welcome'?welcome():state.screen==='brief'?briefing():state.screen==='stage'?stageScreen():state.screen==='lock'?lockScreen():certificate();attach();}
 function startStage(i){state.stage=i;state.questions=makeQuestions(i);state.qIndex=0;state.answers=[];state.feedback=null;state.screen='stage';render();window.scrollTo(0,0);}
 function attach(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action)));document.querySelectorAll('[data-stage]').forEach(el=>el.addEventListener('click',()=>{let i=+el.dataset.stage;if(i===state.stage||i===0||state.completed.slice(0,i).every(Boolean))startStage(i);}));document.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',()=>{state.selectedAnswer=+el.value;if(state.answers[state.qIndex]===undefined&&state.feedback&&!state.feedback.good){state.feedback=null;const f=document.querySelector('.feedback.bad');if(f)f.remove();}}));document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('click',()=>{let k=el.dataset.key;if(k==='clear')state.lockInput='';else if(k==='back')state.lockInput=state.lockInput.slice(0,-1);else if(state.lockInput.length<6)state.lockInput+=k;state.feedback=null;render();}));let nm=document.getElementById('learnerName');if(nm)nm.addEventListener('input',()=>{state.learnerName=nm.value;let t=document.getElementById('certName');if(t)t.textContent=nm.value.trim()||'Cariology Explorer';});}
 function action(a){if(a==='goals'){let g=document.getElementById('learning-goals');if(g)g.style.display=g.style.display==='none'?'block':'none';return;}if(a==='start'){state.screen='brief';render();}else if(a==='enter'){newCode();state.completed=Array(6).fill(false);state.score=0;startStage(0);}else if(a==='answer'){let sel=document.querySelector('input[name="answer"]:checked');if(!sel){state.feedback={good:false,text:'Choose an answer before submitting.'};render();return;}let ix=+sel.value,q=state.questions[state.qIndex],good=ix===q.correctIndex;if(good){state.answers[state.qIndex]=ix;state.score++;state.feedback={good:true,text:q.exp};}else{delete state.answers[state.qIndex];state.feedback={good:false,text:'Not quite — choose another answer and try again. You must answer correctly to continue.'};}render();}else if(a==='next-q'){state.qIndex++;state.feedback=null;render();}else if(a==='finish-stage'){if(state.answers.length<5||state.answers.some(x=>x===undefined)){state.feedback={good:false,text:'Answer all five questions in this stage before continuing.'};render();return;}state.completed[state.stage]=true;state.feedback=null;render();}else if(a==='next-stage'){if(!state.completed[state.stage])state.completed[state.stage]=true;if(state.stage<5)startStage(state.stage+1);else {state.screen='lock';render();}}else if(a==='final-lock'){if(state.completed.every(Boolean)){state.screen='lock';state.lockInput='';state.feedback=null;render();}else{state.feedback={good:false,text:'Complete all six stages first.'};render();}}else if(a==='unlock'){if(state.lockInput===state.code&&state.completed.every(Boolean)){state.screen='certificate';state.feedback=null;}else state.feedback={good:false,text:'Access denied. Enter the six digits awarded by the stages in order.'};render();}else if(a==='back-room'){startStage(5);}else if(a==='reset-stage'){startStage(state.stage);}else if(a==='print-certificate'){window.print();return;}else if(a==='restart'){Object.assign(state,{screen:'welcome',stage:0,completed:Array(6).fill(false),digits:[],code:'',lockInput:'',learnerName:'',questions:[],qIndex:0,answers:[],feedback:null,score:0});render();return;}render();window.scrollTo({top:0,behavior:'smooth'});}
 // Fix touch targets, narrow screens, and prevent horizontal overflow on iOS/Android.
 const style=document.createElement('style');style.textContent=`html,body{width:100%;max-width:100%;overflow-x:clip;-webkit-text-size-adjust:100%;-webkit-overflow-scrolling:touch}button,input{touch-action:manipulation}button,.option,.room-tab,.key{ -webkit-tap-highlight-color:transparent } .option{cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:1px solid #dbe8e4;border-radius:13px;background:#fff;margin:9px 0;line-height:1.45;min-height:48px}.option input{flex:0 0 auto;margin-top:4px;accent-color:#087f83;width:18px;height:18px}.option span{min-width:0;overflow-wrap:anywhere}.ingredient-name{display:block}.ingredient-name strong{display:block}.room-main{overflow-wrap:anywhere}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.form-actions .btn{max-width:100%;white-space:normal}.room-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.room-tab{min-width:0;overflow-wrap:anywhere}.room-layout{grid-template-columns:minmax(0,1.55fr) minmax(0,.7fr)}.room-main,.room-aside,.panel{min-width:0}.question{overflow-wrap:anywhere}.key{min-height:52px;touch-action:manipulation}@media(max-width:850px){.room-layout{grid-template-columns:minmax(0,1fr)}.room-aside{grid-template-columns:repeat(2,minmax(0,1fr))}.room-aside .dark{grid-column:auto}}@media(max-width:560px){.wrap{width:calc(100% - 20px);padding-top:10px}.room-tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.room-tab{font-size:.68rem;padding:10px 6px}.room-main{padding:16px}.room-aside{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}.hero-art{min-height:250px;grid-row:1}.hero-copy{padding:22px 18px}.hero h1{font-size:clamp(2.35rem,12vw,3.5rem)}.hero-actions{width:100%}.hero-actions .btn{width:100%}.brief-head{align-items:flex-start;flex-direction:column}.brief-body{grid-template-columns:minmax(0,1fr);padding:17px}.lock-layout{grid-template-columns:minmax(0,1fr);padding:17px}.lock-graphic{min-height:170px}.code-slots{gap:5px}.code-slot{width:min(12vw,44px);height:50px}.option{padding:12px}.form-actions .btn{flex:1 1 100%;width:100%}.topbar{gap:8px;flex-wrap:wrap}.room-topline{align-items:flex-start;flex-wrap:wrap}.stat-row{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:9px 6px}.stat span{overflow-wrap:anywhere}.certificate{padding:18px 10px}.cert-name{overflow-wrap:anywhere}}@media print{body{background:white}.no-print,.topbar,.ambient{display:none!important}.wrap{width:100%;padding:0}.panel{box-shadow:none}.certificate{break-inside:avoid}}`;
 document.head.appendChild(style);render();
})();

</script>
</body>
